FIRESTORE RULES:
rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null; }
    function mine(uid) { return signedIn() && request.auth.uid == uid; }
    // 1) Profile: sirf apna; 'start' badal nahi sakta
    match /users/{uid} {
      allow read: if mine(uid);
      allow create: if mine(uid)
        && request.resource.data.keys().hasOnly(['name','age','exam','sem','batch','hours','school','start','loginId','consent'])
        && request.resource.data.name is string && request.resource.data.name.size() <= 60
        && request.resource.data.age is number
        && request.resource.data.hours is number
        && request.resource.data.hours >= 1 && request.resource.data.hours <= 12;
      allow update: if mine(uid)
        && request.resource.data.start == resource.data.start
        && request.resource.data.keys().hasOnly(['name','age','exam','sem','batch','hours','school','start','loginId','consent']);
      allow delete: if false;
    }
    // 2) Progress: sirf apna, sirf tay fields
    match /users/{uid}/data/progress {
      allow read: if mine(uid);
      allow write: if mine(uid)
        && request.resource.data.keys().hasOnly(['ts','score','streak','checkedInDate','completed','done','bm','wrong','mocks','fmin','testMode','bhajan','curId','sem','log','yogaMin','remind','fs'])
        && request.resource.data.score is number && request.resource.data.score <= 100000;
    }
    // baaki sab band
    match /{document=**} { allow read, write: if false; }
  }
}

function pickPattern(cnt,sub){const sem=state.sem||'sem1',bank=qbank();if(sub)return shuf(bank.filter(x=>x.sub===sub)).slice(0,cnt);const tw=META[sem].reduce((a,x)=>a+x.w,0);let out=[];const used=new Set();META[sem].forEach(x=>{const q=shuf(bank.filter(y=>y.sub===x.n)).slice(0,Math.round(cnt*x.w/tw));q.forEach(y=>used.add(y.id));out=out.concat(q)});if(out.length<cnt)out=out.concat(shuf(bank.filter(y=>!used.has(y.id))).slice(0,cnt-out.length));return shuf(out).slice(0,cnt)}
function startMock(cnt){const sub=$('mkSub').value,neg=$('mkNeg').checked,qs=pickPattern(cnt,sub).map(q=>{const ix=shuf(q.opts.map((_,i)=>i));return{...q,o:ix.map(i=>q.opts[i]),a:ix.indexOf(q.ans)}});if(!qs.length)return toast('इस विषय में प्रश्न नहीं मिले');mk={qs,ans:qs.map(()=>-1),i:0,neg,end:Date.now()+qs.length*60000,done:false};clearInterval(mk.t);mk.t=setInterval(()=>{const e=$('mkT'),s=Math.max(0,Math.ceil((mk.end-Date.now())/1000));if(e)e.textContent=fmt(s);if(s<=0)submitMock()},500);drawQ()}
function drawQ(){const q=mk.qs[mk.i],last=mk.i===mk.qs.length-1;$('mockBody').innerHTML=`<div class="setbox"><b>⏱ <span id="mkT">${fmt(Math.max(0,Math.ceil((mk.end-Date.now())/1000)))}</span> · प्रश्न ${mk.i+1}/${mk.qs.length} · उत्तर दिए: ${mk.ans.filter(x=>x>=0).length}</b></div><article class="question-card"><span class="tag">${esc(q.sub)} · ${esc(q.year)}</span><h3>${esc(q.q)}</h3>${q.o.map((o,j)=>`<button type="button" class="qo ${mk.ans[mk.i]===j?'sel':''}" data-o="${j}" aria-pressed="${mk.ans[mk.i]===j}">${esc(o)}</button>`).join('')}</article><div class="action-row"><button class="btn secondary" id="mkP" type="button" ${mk.i?'':'disabled'}>← पिछला</button><button class="btn secondary" id="mkC" type="button">साफ़ करें</button><button class="btn secondary" id="mkN" type="button" ${last?'disabled':''}>अगला →</button></div><button class="btn primary big" id="mkS" type="button">टेस्ट जमा करें ✓</button>`;
document.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{mk.ans[mk.i]=+b.dataset.o;drawQ()});$('mkP').onclick=()=>{mk.i--;drawQ()};$('mkN').onclick=()=>{mk.i++;drawQ()};$('mkC').onclick=()=>{mk.ans[mk.i]=-1;drawQ()};$('mkS').onclick=()=>{if(confirm('टेस्ट जमा करें?'))submitMock()}}
function submitMock(){if(!mk||mk.done)return;mk.done=true;clearInterval(mk.t);let c=0,w=0,u=0;const by={},wr=[];mk.qs.forEach((q,i)=>{const b=by[q.sub]=by[q.sub]||{c:0,w:0,u:0};if(mk.ans[i]<0){u++;b.u++}else if(mk.ans[i]===q.a){c++;b.c++}else{w++;b.w++;state.wrong[q.id]=Date.now();wr.push({q,i})}});
const sc=Math.round((c-(mk.neg?w*.25:0))*100)/100;(state.mocks=state.mocks||[]).push({ts:Date.now(),s:sc,c,w,n:mk.qs.length});state.mocks=state.mocks.slice(-20);state.score+=Math.max(0,Math.round(c/2));save();updateStats();
$('mockBody').innerHTML=`<div class="setbox"><h2>आपका स्कोर: ${sc} / ${mk.qs.length}</h2><p class="muted">${c} सही · ${w} गलत${mk.neg?' (−¼ अंक)':''} · ${u} छोड़े</p></div><div class="setbox"><b>विषयवार रिपोर्ट</b>${Object.entries(by).map(([k,v])=>`<div class="plan-row"><b>${v.c}/${v.c+v.w+v.u}</b><span>${esc(k)} <small>(${v.w} गलत, ${v.u} छोड़े)</small></span></div>`).join('')}</div>`+(wr.length?`<div class="setbox"><b>गलत प्रश्न और सही उत्तर</b>${wr.map(x=>`<article class="question-card"><span class="tag">${esc(x.q.year)}</span><h3>${esc(x.q.q)}</h3><p class="muted">आपका उत्तर: ${esc(x.q.o[mk.ans[x.i]])}<br>सही उत्तर: <b>${esc(x.q.o[x.q.a])}</b></p></article>`).join('')}<p class="muted">ये प्रश्न "गलत प्रश्न" सेक्शन में जुड़ गए हैं।</p></div>`:'')+`<button class="btn primary big" id="mkAgain" type="button">नया टेस्ट</button>`;$('mkAgain').onclick=()=>{mk=null;renderMock()}}

function renderWrong(){const qs=Object.keys(state.wrong||{}).map(qById).filter(Boolean);$('wrongBody').innerHTML=qs.length?qs.map(q=>`<article class="question-card"><span class="tag">${esc(q.sub)} · ${esc(q.year)}</span><h3>${esc(q.q)}</h3><p class="muted">सही उत्तर: <b>${esc(q.opts[q.ans])}</b></p><button class="chip" data-w="${esc(q.id)}" type="button">✓ समझ गया</button></article>`).join(''):'<p class="center-note">🎉 कोई गलत प्रश्न बाकी नहीं।</p>'}
$('wrongBody').onclick=e=>{const b=e.target.closest('[data-w]');if(b){delete state.wrong[b.dataset.w];save();renderWrong()}};

function saveRem(){state.remind={on:$('remOn').checked,m:$('remM').value,s:$('remS').value,b:$('remB').value};save()}

function notify(t,b){try{if(Notification.permission==='granted'){new Notification(t,{body:b});return}}catch{}toast('🔔 '+t+': '+b)}
function remTick(){const r=state.remind;if(!r||!r.on||!state.user)return;const now=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()),d=today();const fire=(k,t,b)=>{const fk='fg-rem-'+k+d;if(r[k]===now&&!localStorage.getItem(fk)){localStorage.setItem(fk,'1');notify(t,b)}};fire('m','🌅 ब्रह्ममुहूर्त','उठकर check-in और योग का समय!');fire('s','📖 आज का लक्ष्य',goalText());fire('b','🔁 बैकलॉग',backlog(d).length+' पेपर बाकी हैं')}

const AIV='https://www.gstatic.com/firebasejs/11.10.0/',AI_MODEL='gemini-2.5-flash';let aiM=null;
async function aiModel(){if(aiM)return aiM;const[a,ai]=await Promise.all([import(AIV+'firebase-app.js'),import(AIV+'firebase-ai.js')]);const app=a.initializeApp(CFG,'ai');aiM=ai.getGenerativeModel(ai.getAI(app,{backend:new ai.GoogleAIBackend()}),{model:AI_MODEL,systemInstruction:'आप उत्तर प्रदेश के BTC D.El.Ed (2 वर्ष, 4 सेमेस्टर) के विद्यार्थियों के लिए सरल हिंदी में पढ़ाने वाले शिक्षक हैं। विषय: बाल विकास, शिक्षण-अधिगम, विज्ञान, गणित, सामाजिक अध्ययन, हिन्दी, अंग्रेजी, संस्कृत, कंप्यूटर, शैक्षिक मूल्यांकन, समावेशी शिक्षा, शैक्षिक प्रबन्धन आदि। उत्तर चरण-दर-चरण दें, ज़रूरी परिभाषा/सूत्र अलग पंक्ति में लिखें, अंत में "स्रोत/पढ़ने का विषय" (मानक पाठ्यपुस्तक या टॉपिक का नाम; निश्चित न हों तो साफ़ कहें) और 3 बहुविकल्पीय अभ्यास प्रश्न उत्तर सहित दें। तथ्य या संख्या के बारे में निश्चित न हों तो बताएँ। केवल पढ़ाई से जुड़े प्रश्नों के उत्तर दें।'});return aiM}
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>rej(new Error('फोटो पढ़ी नहीं जा सकी'));im.src=u})}
const aiErr=e=>/dynamically imported|Failed to fetch|NetworkError/i.test(e.message||'')?'AI सेवा लोड नहीं हुई, इंटरनेट जाँचकर फिर कोशिश करें।':e.message==='timeout'?'नेटवर्क धीमा है, फिर कोशिश करें।':/permission|403|API|not.?found|disabled/i.test(e.message||'')?'Firebase console में AI Logic चालू करें (और model का नाम जाँचें)।':(e.message||'अज्ञात त्रुटि').slice(0,120);
$('aiAsk').onclick=async()=>{const q=$('aiQ').value.trim(),f=$('aiImg').files[0];if(!q&&!f)return toast('सवाल लिखें या फोटो चुनें');if(!navigator.onLine)return toast('AI के लिए इंटरनेट चाहिए');const day=LG();if((day.a||0)>=20)return toast('आज के 20 सवाल पूरे हो गए, कल फिर पूछें');$('aiAsk').disabled=true;$('aiOut').textContent='⏳ सोच रहा हूँ…';
try{const m=await withT(aiModel(),20000),parts=[q||'इस फोटो का सवाल हल करके समझाइए'];if(f)parts.push({inlineData:{mimeType:'image/jpeg',data:await shrink(f)}});const r=await withT(m.generateContent(parts),60000);day.a=(day.a||0)+1;save();$('aiOut').textContent=r.response.text().replace(/\*\*/g,'').replace(/^#+\s*/gm,'')}catch(e){$('aiOut').textContent='AI अभी नहीं चल पाया: '+aiErr(e)}finally{$('aiAsk').disabled=false}};

if(last&&last.uid&&last.prof){KEY='fg-u-'+last.uid;let loc={};try{loc=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}optimistic=last.uid;begin(last.prof,loc)}else showPage('welcomePage');
$('splash').classList.add('hidden')})();
