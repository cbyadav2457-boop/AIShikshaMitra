<!DOCTYPE html>
<!-- 24x7 Focus Gurukul. SETUP: (1) Firebase Authentication -> Email/Password ON. (2) Firestore -> Rules me neeche ke rules paste + Publish. (3) Authentication -> Settings -> Authorized domains me apna GitHub Pages domain jodein. (4) AI ke liye Firebase console -> AI Logic -> Gemini Developer API ON (API key is file me nahi hai).
FIRESTORE RULES:
rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null; }
    function mine(uid) { return signedIn() && request.auth.uid == uid; }

    // 1) Profile: sirf apna; 'start' badal nahi sakta
    match /users/{uid} {
      allow read: if mine(uid);
      allow create: if mine(uid)
        && request.resource.data.keys().hasOnly(['name','age','exam','hours','school','start','loginId','consent'])
        && request.resource.data.name is string && request.resource.data.name.size() <= 60
        && request.resource.data.age is number
        && request.resource.data.hours is number
        && request.resource.data.hours >= 1 && request.resource.data.hours <= 12;
      allow update: if mine(uid)
        && request.resource.data.start == resource.data.start
        && request.resource.data.keys().hasOnly(['name','age','exam','hours','school','start','loginId','consent']);
      allow delete: if false;
    }

    // 2) Progress: sirf apna, sirf tay fields
    match /users/{uid}/data/progress {
      allow read: if mine(uid);
      allow write: if mine(uid)
        && request.resource.data.keys().hasOnly(['ts','score','streak','checkedInDate','completed','done','bm','wrong','mocks','fmin','testMode','bhajan','curId','log','yogaMin','remind','fs'])
        && request.resource.data.score is number && request.resource.data.score <= 100000;
    }

    // 3) Content: login wale students sirf padh sakte hain, likh nahi
    match /topics/{id} { allow read: if signedIn(); allow write: if false; }
    match /meta/{id}   { allow read: if signedIn(); allow write: if false; }

    // baaki sab band
    match /{document=**} { allow read, write: if false; }
  }
}

let AC,stopB=null;const ctx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function bell(c){const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+3);o.start();o.stop(c.currentTime+3)}

const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

let mk=null;
function renderMock(){if(mk&&!mk.done)return drawQ();const n=QBANK.length,h=(state.mocks||[]).slice(-5).reverse(),c1=Math.min(10,n);
$('mockBody').innerHTML=`<div class="setbox"><b>परीक्षा पैटर्न (अधिसूचना पेज 19–20)</b><div class="plan-row"><b>100</b><span>प्रश्न · 100 अंक · 120 मिनट · हर गलत उत्तर पर −¼ अंक</span></div></div><div class="setbox">${n<100?`<p class="muted">⚠ प्रश्न-बैंक में अभी ${n} प्रश्न हैं।</p>`:'<p class="muted">प्रश्न विषयवार अंक-भार (आधिकारिक तालिका) के अनुसार चुने जाते हैं।</p>'}<button class="btn primary big" id="mk1" type="button">छोटा मॉक: ${c1} प्रश्न · ${Math.round(c1*1.2)} मिनट</button><button class="btn secondary big" id="mk2" type="button">पूरा पैटर्न: ${Math.min(100,n)} प्रश्न · ${Math.round(Math.min(100,n)*1.2)} मिनट</button></div>`+(h.length?`<div class="setbox"><b>पिछले मॉक</b>${h.map(x=>`<div class="plan-row"><b>${x.s}</b><span>${x.c} सही · ${x.w} गलत · ${x.n} में से</span></div>`).join('')}</div>`:'');
$('mk1').onclick=()=>startMock(c1);$('mk2').onclick=()=>startMock(Math.min(100,n))}
const MW={'TOM & Machine Design':15,'Engineering Mechanics':10,'Strength of Materials':10,'Thermodynamics':5,'IC Engine':5,'Steam Eng. & Power Plant':5,'Refrigeration & Air Comp.':5,'Fluid Mech. & Hydraulic Machines':10,'Computer & IT':15,'उत्तर प्रदेश GK':20};
function pickPattern(cnt){let out=[];const used=new Set();for(const [s,w] of Object.entries(MW)){const q=shuf(QBANK.filter(x=>x.sub===s)).slice(0,Math.round(cnt*w/100));q.forEach(x=>used.add(x.id));out=out.concat(q)}if(out.length<cnt)out=out.concat(shuf(QBANK.filter(x=>!used.has(x.id))).slice(0,cnt-out.length));return shuf(out).slice(0,cnt)}
function startMock(cnt){const qs=pickPattern(cnt).map(q=>{const ix=shuf(q.opts.map((_,i)=>i));return{...q,o:ix.map(i=>q.opts[i]),a:ix.indexOf(q.ans)}});mk={qs,ans:qs.map(()=>-1),i:0,end:Date.now()+Math.round(cnt*1.2*60000),done:false};clearInterval(mk.t);mk.t=setInterval(()=>{const e=$('mkT');const s=Math.max(0,Math.ceil((mk.end-Date.now())/1000));if(e)e.textContent=fmt(s);if(s<=0)submitMock()},500);drawQ()}
function drawQ(){const q=mk.qs[mk.i],last=mk.i===mk.qs.length-1;$('mockBody').innerHTML=`<div class="setbox"><b>⏱ <span id="mkT">${fmt(Math.max(0,Math.ceil((mk.end-Date.now())/1000)))}</span> · प्रश्न ${mk.i+1}/${mk.qs.length} · उत्तर दिए: ${mk.ans.filter(x=>x>=0).length}</b></div><article class="question-card"><span class="tag">${esc(q.sub)}</span><h3>${esc(q.q)}</h3>${q.o.map((o,j)=>`<button type="button" class="qo ${mk.ans[mk.i]===j?'sel':''}" data-o="${j}" aria-pressed="${mk.ans[mk.i]===j}">${esc(o)}</button>`).join('')}</article><div class="action-row"><button class="btn secondary" id="mkP" type="button" ${mk.i?'':'disabled'}>← पिछला</button><button class="btn secondary" id="mkC" type="button">साफ़ करें</button><button class="btn secondary" id="mkN" type="button" ${last?'disabled':''}>अगला →</button></div><button class="btn primary big" id="mkS" type="button">टेस्ट जमा करें ✓</button>`;
document.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{mk.ans[mk.i]=+b.dataset.o;drawQ()});$('mkP').onclick=()=>{mk.i--;drawQ()};$('mkN').onclick=()=>{mk.i++;drawQ()};$('mkC').onclick=()=>{mk.ans[mk.i]=-1;drawQ()};$('mkS').onclick=()=>{if(confirm('टेस्ट जमा करें?'))submitMock()}}
function submitMock(){if(!mk||mk.done)return;mk.done=true;clearInterval(mk.t);let c=0,w=0,u=0;const by={},wr=[];mk.qs.forEach((q,i)=>{const b=by[q.sub]=by[q.sub]||{c:0,w:0,u:0};if(mk.ans[i]<0){u++;b.u++}else if(mk.ans[i]===q.a){c++;b.c++}else{w++;b.w++;state.wrong[q.id]=Date.now();wr.push({q,i})}});
const sc=Math.round((c-w*.25)*100)/100;(state.mocks=state.mocks||[]).push({ts:Date.now(),s:sc,c,w,n:mk.qs.length});state.mocks=state.mocks.slice(-20);state.score+=Math.max(0,Math.round(c/2));save();updateStats();
$('mockBody').innerHTML=`<div class="setbox"><h2>आपका स्कोर: ${sc} / ${mk.qs.length}</h2><p class="muted">${c} सही · ${w} गलत (−¼ अंक) · ${u} छोड़े</p></div><div class="setbox"><b>विषयवार रिपोर्ट</b>${Object.entries(by).map(([k,v])=>`<div class="plan-row"><b>${v.c}/${v.c+v.w+v.u}</b><span>${esc(k)} <small>(${v.w} गलत, ${v.u} छोड़े)</small></span></div>`).join('')}</div>`+(wr.length?`<div class="setbox"><b>गलत प्रश्न और व्याख्या</b>${wr.map(x=>`<article class="question-card"><h3>${esc(x.q.q)}</h3><p class="muted">आपका उत्तर: ${esc(x.q.o[mk.ans[x.i]])}<br>सही उत्तर: <b>${esc(x.q.o[x.q.a])}</b><br>${esc(x.q.exp)}</p></article>`).join('')}<p class="muted">ये प्रश्न "गलत प्रश्न" सेक्शन में जुड़ गए हैं।</p></div>`:'')+`<button class="btn primary big" id="mkAgain" type="button">नया टेस्ट</button>`;$('mkAgain').onclick=()=>{mk=null;renderMock()}}
// --- wrong-question notebook ---
function renderWrong(){const ids=Object.keys(state.wrong||{}).filter(id=>QBANK.some(q=>q.id===id));$('wrongBody').innerHTML=ids.length?ids.map(id=>{const q=QBANK.find(x=>x.id===id);return `<article class="question-card"><span class="tag">${esc(q.sub)}</span><h3>${esc(q.q)}</h3><p class="muted">सही उत्तर: <b>${esc(q.opts[q.ans])}</b><br>${esc(q.exp)}</p><button class="chip" data-w="${esc(id)}" type="button">✓ समझ गया</button></article>`}).join(''):'<p class="center-note">🎉 कोई गलत प्रश्न बाकी नहीं।</p>'}
$('wrongBody').onclick=e=>{const b=e.target.closest('[data-w]');if(b){delete state.wrong[b.dataset.w];save();renderWrong()}};

function renderRem(){const r=state.remind||{};$('remOn').checked=!!r.on;$('remM').value=r.m||'04:00';$('remS').value=r.s||'18:00';$('remB').value=r.b||'10:00';$('remInfo').textContent=('Notification' in window)?`अनुमति: ${Notification.permission}`:'इस ब्राउज़र में notification उपलब्ध नहीं'}
function saveRem(){state.remind={on:$('remOn').checked,m:$('remM').value,s:$('remS').value,b:$('remB').value};save()}
['remOn','remM','remS','remB'].forEach(i=>$(i).onchange=saveRem);
$('remPerm').onclick=async()=>{try{await Notification.requestPermission()}catch{}renderRem()};

function remTick(){const r=state.remind;if(!r||!r.on||!state.user)return;const now=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()),d=today();const fire=(k,t,b)=>{const fk='fg-rem-'+k+d;if(r[k]===now&&!localStorage.getItem(fk)){localStorage.setItem(fk,'1');notify(t,b)}};fire('m','🌅 ब्रह्ममुहूर्त','उठकर check-in और योग का समय!');fire('s','📖 आज का लक्ष्य',goalText());fire('b','🔁 बैकलॉग',backlog(d).length+' topics बाकी हैं')}
setInterval(remTick,30000);
// --- AI study assistant (Firebase AI Logic: API key code me nahi) ---
const AIV='https://www.gstatic.com/firebasejs/11.10.0/',AI_MODEL='gemini-2.5-flash';let aiM=null;
async function aiModel(){if(aiM)return aiM;const[a,ai]=await Promise.all([import(AIV+'firebase-app.js'),import(AIV+'firebase-ai.js')]);const app=a.initializeApp(CFG,'ai');aiM=ai.getGenerativeModel(ai.getAI(app,{backend:new ai.GoogleAIBackend()}),{model:AI_MODEL,systemInstruction:'आप UPSSSC JE (Mechanical) के विद्यार्थियों के लिए सरल हिंदी में पढ़ाने वाले शिक्षक हैं। उत्तर चरण-दर-चरण दें, ज़रूरी सूत्र अलग पंक्ति में लिखें, अंत में "स्रोत/पढ़ने का विषय" (मानक पाठ्यपुस्तक या टॉपिक का नाम; निश्चित न हों तो साफ़ कहें) और 3 अभ्यास प्रश्न उत्तर सहित दें। तथ्य या संख्या के बारे में निश्चित न हों तो बताएँ। केवल पढ़ाई से जुड़े प्रश्नों के उत्तर दें।'});return aiM}
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=()=>rej(new Error('फोटो पढ़ी नहीं जा सकी'));im.src=u})}
const aiErr=e=>/dynamically imported|Failed to fetch|NetworkError/i.test(e.message||'')?'AI सेवा लोड नहीं हुई, इंटरनेट जाँचकर फिर कोशिश करें।':e.message==='timeout'?'नेटवर्क धीमा है, फिर कोशिश करें।':/permission|403|API|not.?found|disabled/i.test(e.message||'')?'Firebase console में AI Logic चालू करें (और model का नाम जाँचें)।':(e.message||'अज्ञात त्रुटि').slice(0,120);
$('aiAsk').onclick=async()=>{const q=$('aiQ').value.trim(),f=$('aiImg').files[0];if(!q&&!f)return toast('सवाल लिखें या फोटो चुनें');if(!navigator.onLine)return toast('AI के लिए इंटरनेट चाहिए');const day=LG();if((day.a||0)>=20)return toast('आज के 20 सवाल पूरे हो गए, कल फिर पूछें');$('aiAsk').disabled=true;$('aiOut').textContent='⏳ सोच रहा हूँ…';
try{const m=await withT(aiModel(),20000),parts=[q||'इस फोटो का सवाल हल करके समझाइए'];if(f)parts.push({inlineData:{mimeType:'image/jpeg',data:await shrink(f)}});const r=await withT(m.generateContent(parts),60000);day.a=(day.a||0)+1;save();$('aiOut').textContent=r.response.text().replace(/\*\*/g,'').replace(/^#+\s*/gm,'')}catch(e){$('aiOut').textContent='AI अभी नहीं चल पाया: '+aiErr(e)}finally{$('aiAsk').disabled=false}};

const _sp2=showPage;showPage=function(id){_sp2(id);applyFS();if(id==='homePage')renderGoal();if(id==='mockPage')renderMock();if(id==='wrongPage')renderWrong();if(id==='remPage')renderRem()};

let optimistic=null;
async function reconcile(u){try{try{const p=await FB.getDoc(FB.doc(FB.db,'users',u.uid));if(p.exists())localStorage.setItem('fg-last',JSON.stringify({uid:u.uid,prof:p.data()}))}catch{}let c={};try{const g=await FB.getDoc(FB.doc(FB.db,'users',u.uid,'data','progress'));if(g.exists())c=g.data()}catch{}applyMerged(mergeP(snap(),c));cloudDirty=true;flush();try{const m=await FB.getDoc(FB.doc(FB.db,'meta','index'));if(m.exists()&&Array.isArray(m.data().topics)&&m.data().topics.length){INDEX.length=0;INDEX.push(...m.data().topics)}}catch{}}catch{}}
(function boot(){let last=null;try{last=JSON.parse(localStorage.getItem('fg-last')||'null')}catch{}
if(last&&last.uid&&last.prof){KEY='fg-u-'+last.uid;let loc={};try{loc=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}optimistic=last.uid;begin(last.prof,loc)}else showPage('welcomePage');
$('splash').classList.add('hidden')})();
fbReady.then(ok=>{if(!ok){if(!optimistic)toast('इंटरनेट/Firebase नहीं मिला। नेट जाँचकर पेज फिर खोलें।');return}
FB.onAuthStateChanged(FB.auth,u=>{if(regBusy)return;if(u){if(optimistic===u.uid)reconcile(u);else enter(u).catch(()=>{})}else if(optimistic){optimistic=null;localStorage.removeItem('fg-last');KEY='';showPage('welcomePage');toast('कृपया फिर से Login करें')}})});
