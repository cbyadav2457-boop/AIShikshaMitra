function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),3000)}

let AC,stopB=null;const ctx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function bell(c){const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+3);o.start();o.stop(c.currentTime+3)}
function drone(){const c=ctx();c.resume();const g=c.createGain();g.gain.value=0;g.connect(c.destination);const os=[130.8,196,261.6].map(f=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);o.start();return o});g.gain.linearRampToValueAtTime(.12,c.currentTime+3);bell(c);const b=setInterval(()=>bell(c),5000);let done=false;const stop=()=>{if(done)return;done=true;clearInterval(b);g.gain.linearRampToValueAtTime(0,c.currentTime+2);setTimeout(()=>os.forEach(o=>o.stop()),2200)};setTimeout(stop,60000);return stop}
function siren(sec){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.connect(g);g.connect(c.destination);g.gain.value=.25;const t=c.currentTime;for(let i=0;i<sec*2;i++)o.frequency.setValueAtTime(i%2?600:1000,t+i*.5);o.start();o.stop(t+sec)}

rows.sort((a,b)=>a[0]-b[0]);
const avg=P.H*6/P.subs.length,dn=Math.max(0,dayNo(d)),pct=Math.min(100,Math.round((dn+1)/.9));
$('planBody').innerHTML=`<div class="setbox"><b>90 दिन का सफ़र: दिन ${Math.min(dn+1,90)}/90</b><div style="height:8px;background:#e9eaf3;border-radius:6px"><div style="height:8px;border-radius:6px;background:#6357d9;width:${pct}%"></div></div><span>${PH(dn)}</span><small class="muted">दिन 1–60 सीखना · 61–80 रिवीज़न · 81–90 मॉक टेस्ट · हर रविवार backlog + साप्ताहिक रिवीज़न। किसी भी दिन का topic Subjects में तारीख बदलकर देखें।</small></div><div class="setbox"><b>आज (${dlabel(d)}) की समय-सारणी</b>${rows.map(r=>`<div class="plan-row"><b>${hh(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div><div class="setbox"><b>हफ़्ते में subject-wise समय</b>${P.subs.map(s=>`<div class="plan-row"><b>${P.cnt[s.n]} घं.</b><span>${esc(s.n)} <small>${P.cnt[s.n]>avg*1.3?'· ज़्यादा':P.cnt[s.n]<avg*.8?'· कम':''}</small></span></div>`).join('')}</div><p class="muted">पूरा syllabus लगभग <b>${P.weeks} हफ़्ते</b> में एक बार पूरा होगा (सोम–शनि नया पाठ, रविवार को backlog + रिवीज़न)।${P.capped?' ध्यान दें: स्कूल समय के कारण आपके चुने घंटों में से कम स्लॉट मिले।':''}${P.H*6<P.subs.length?' कम से कम 2 घंटे चुनें, वरना कुछ विषय छूटेंगे।':''}</p><p class="muted">Syllabus और अंक-भार आपके दिए notification (पेज 17–20) के अनुसार हैं।</p>`}
function itemCard(it,lbl){const dn=state.done[it.key];return `<article class="question-card"><span class="tag">${esc(it.sub)}${lbl?' · '+lbl:''}</span><h3>${esc(it.topic)}${it.round>1?' <small>(रिवीज़न '+it.round+')</small>':''}</h3><div class="action-row" data-key="${esc(it.key)}"><button class="chip" data-a="n">📖 Notes</button><button class="chip" data-a="f">🃏 Flashcards</button><button class="chip" data-a="t">✅ Test</button><button class="chip ${dn?'on':''}" data-a="d">${dn?'✓ पूरा':'पूरा करें'}</button></div></article>`}
function renderSubj(){const d=state.sDate,pl=planFor(d);$('subjDate').textContent=dlabel(d)+(d===today()?' (आज)':'');const list=pl.sun?backlog(d).map(i=>itemCard(i,dlabel(i.date))):pl.items.map(i=>itemCard(i));$('subjList').innerHTML=(pl.sun?'<p class="muted">रविवार: सप्ताह के बचे हुए (backlog) topics + रिवीज़न।</p>':'')+(list.join('')||'<p class="center-note">इस दिन कोई topic नहीं।</p>')}
function renderBlog(){const b=backlog(today());$('blogList').innerHTML=(b.map(i=>itemCard(i,dlabel(i.date))).join(''))||'<p class="center-note">🎉 कोई backlog नहीं!</p>';$('blogNote').textContent=`${b.length} topics बाकी। ये रविवार के प्लान में अपने-आप जुड़ जाते हैं।`}
function itemAct(e){const b=e.target.closest('[data-a]');if(!b)return;const key=b.parentNode.dataset.key,a=b.dataset.a;if(a==='f'){state.tag='सभी';return showPage('reelsPage')}if(a==='d'){const was=state.done[key];if(was)delete state.done[key];else state.done[key]=1;const g=LG();g.t=Math.max(0,g.t+(was?-1:1));save();renderSubj();renderBlog();return}toast('📖 इस topic का content database जुड़ने के बाद आएगा। अभी Study tab में demo देखें।')}
$('subjList').onclick=itemAct;$('blogList').onclick=itemAct;
$('subjPrev').onclick=()=>{state.sDate=addD(state.sDate,-1);renderSubj()};$('subjNext').onclick=()=>{state.sDate=addD(state.sDate,1);renderSubj()};
function renderSyl(){const P=EXAMS['UPSSSC JE'],ks=Object.keys(state.done),dn=(s,t)=>ks.some(k=>k.endsWith('|'+s+'|'+t)),part=i=>i===0?'भाग-1: विषयगत ज्ञान (65 प्रश्न)':i===8?'भाग-2: कंप्यूटर व IT (15 प्रश्न)':'भाग-3: उत्तर प्रदेश GK (20 प्रश्न)';
$('sylBody').innerHTML=`<div class="setbox"><b>परीक्षा योजना</b><div class="plan-row"><b>100</b><span>प्रश्न · 100 अंक · 2 घंटे (120 मिनट)</span></div><div class="plan-row"><b>MCQ</b><span>सभी प्रश्न objective, हर प्रश्न 1 अंक</span></div><div class="plan-row"><b>−¼</b><span>हर गलत उत्तर पर 25% अंक कटेगा</span></div></div>`+P.map((s,i)=>`${[0,8,9].includes(i)?`<p class="eyebrow">${part(i)}</p>`:''}<details class="setbox"><summary><b>${esc(s.n)}</b> · ${s.w} प्रश्न · ${s.t.filter(t=>dn(s.n,t)).length}/${s.t.length} पूरे</summary>${s.t.map(t=>`<div class="plan-row"><b>${dn(s.n,t)?'✓':'○'}</b><span>${esc(t)}</span></div>`).join('')}</details>`).join('')+'<p class="muted">स्रोत: आपके दिए notification के पेज 17–20 (कुल 44 में से)। अंतिम पुष्टि official notification से ज़रूर करें।</p>'}
// ===== analysis =====
state.am='t';state.ar=7;const AM={t:'टॉपिक पूरे',f:'फोकस मिनट',y:'योग मिनट'};
function renderAna(){const m=state.am,t=today();let days=[];if(state.ar===7)for(let i=6;i>=0;i--)days.push(addD(t,-i));else{const p=t.slice(0,8);for(let i=1;i<=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate();i++)days.push(p+String(i).padStart(2,'0'))}
const v=days.map(d=>(state.log[d]||{})[m]||0),mx=Math.max(1,...v),w=300/days.length;
const bars=v.map((x,i)=>{const h=Math.round(x/mx*110);return `<rect x="${10+i*w+w*.15}" y="${130-h}" width="${w*.7}" height="${h}" rx="3" fill="#6357d9"/><text x="${10+i*w+w/2}" y="148" font-size="${days.length>10?7:9}" text-anchor="middle" fill="#81859c">${days.length>10?(i%5==0?i+1:''):WD[new Date(days[i]+'T00:00:00Z').getUTCDay()]}</text>${x?`<text x="${10+i*w+w/2}" y="${125-h}" font-size="8" text-anchor="middle" fill="#6357d9">${x}</text>`:''}`}).join('');
$('anaChips').innerHTML=Object.entries(AM).map(([k,n])=>`<button class="chip ${k===m?'on':''}" data-m="${k}">${n}</button>`).join('')+[[7,'7 दिन'],[30,'इस महीने']].map(([r,n])=>`<button class="chip ${r===state.ar||(r===30&&state.ar!==7)?'on':''}" data-r="${r}">${n}</button>`).join('');
$('anaChart').innerHTML=`<svg viewBox="0 0 320 156" width="100%">${bars}</svg>`;
const tot=v.reduce((a,b)=>a+b,0);$('anaSum').innerHTML=`कुल ${AM[m]}: <b>${tot}</b> · सक्रिय दिन: <b>${v.filter(x=>x).length}</b> · Morning streak: <b>${effStreak()}</b> दिन`}
$('anaChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m)state.am=b.dataset.m;if(b.dataset.r)state.ar=+b.dataset.r;renderAna()};
const WD=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
// ===== yoga =====
let yT=null,yEnd=0;
function yogaReset(){clearInterval(yT);yT=null;$('yogaStart').textContent='▶ शुरू करें';$('yogaCircle').classList.remove('breath');$('yogaTime').textContent=fmt(state.yogaMin*60);$('yogaMsg').textContent='आराम से बैठें, आँखें बंद करें'}
function renderYoga(){$('yogaChips').innerHTML=[10,15,20].map(m=>`<button class="chip ${m===state.yogaMin?'on':''}" data-y="${m}">${m} मिनट</button>`).join('');if(!yT)yogaReset()}
$('yogaChips').onclick=e=>{const b=e.target.closest('[data-y]');if(b&&!yT){state.yogaMin=+b.dataset.y;save();renderYoga()}};
$('yogaStart').onclick=()=>{if(yT)return yogaReset();try{ctx().resume()}catch{}yEnd=Date.now()+state.yogaMin*60000;$('yogaStart').textContent='■ रोकें';$('yogaCircle').classList.add('breath');
yT=setInterval(()=>{const s=Math.ceil((yEnd-Date.now())/1000);$('yogaTime').textContent=fmt(Math.max(0,s));$('yogaMsg').textContent=Math.floor(Date.now()/4000)%2?'सांस छोड़ें…':'सांस लें…';if(s<=0){const m=state.yogaMin;yogaReset();bell(ctx());LG().y+=m;state.score+=1;save();updateStats();toast(`${m} मिनट ध्यान पूरा! +1 अंक 🧘`)}},500)};
// ===== brahmamuhurta =====
function renderBm(){const h=+new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',hourCycle:'h23'}).format(new Date());$('bmStatus').textContent=state.testMode?'Test mode ON: अभी भी check-in हो सकता है':h===4?'🙏 अभी ब्रह्ममुहूर्त चल रहा है — check-in करें':'ब्रह्ममुहूर्त: सुबह 4:00 से 5:00 बजे (IST) के बीच check-in होता है'}
const _sp=showPage;showPage=function(id){_sp(id);if(id==='planPage')renderPlan();if(id==='subjPage')renderSubj();if(id==='anaPage')renderAna();if(id==='blogPage')renderBlog();if(id==='yogaPage')renderYoga();if(id==='bmPage')renderBm();if(id==='syllPage')renderSyl();document.querySelector('.app-header').classList.toggle('hidden',id==='welcomePage')};
showPage('welcomePage');
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});addEventListener('pagehide',flush);
fbReady.then(ok=>{if(!ok){$('splash').classList.add('hidden');return toast('Firebase नहीं मिला: इंटरनेट जाँचें')}FB.onAuthStateChanged(FB.auth,u=>{if(regBusy)return;if(u)enter(u);else{$('splash').classList.add('hidden');showPage('welcomePage')}})});
</script></body></html>
